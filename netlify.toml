[build]
  base = "frontend"
  # Install dependencies (including devDependencies like craco) before building
  command = "yarn install --production=false --network-timeout 600000 && yarn build"
  publish = "build"

[build.environment]
  # CRA treats lint warnings as errors when CI=true; don't fail the deploy on warnings.
  CI = "false"
  NODE_VERSION = "20"

# Single-page app: let React Router handle all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
